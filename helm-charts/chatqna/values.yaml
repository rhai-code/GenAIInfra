# Default values for chatqna.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: opea/chatqna
  tag: "1.2"

route:
  enabled: true

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  #   fsGroup: 2000

securityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  
  capabilities:
    drop:
    - ALL
  seccompProfile:
    type: RuntimeDefault
  # Below false works when combined with privileged oc account.
  # oc adm policy add-scc-to-user privileged -z <my service account> -n <my namespace>
  privileged: false

# moved to rh-gaudi-xxx-values.yaml
# ModelCar endpoints configuration (commented out until ModelCar is available)
# If uncommented will override the default endpoints for LLM, embedding, and reranker in deployment_modelcar.yaml
# modelcar:
#   endpoints:
#     llm:
#       host: "granite-30-8b-instruct-predictor.ed-opea-modelcar.svc.cluster.local"
#       port: "80"

# service port -> container port (aka. targetPort)
# Container port - using containerPorts reference
port: 8888
service:
  type: ClusterIP
  port: 8888

nodeSelector: {}

tolerations: []

affinity: {}

# This is just to avoid Helm errors when HPA is NOT used
# (use hpa-values.yaml files to actually enable HPA).
autoscaling:
  enabled: false

# Optional subcharts enablement and subcharts settings overwritten
# LLM choice, tgi by default.
tgi:
  enabled: false
  LLM_MODEL_ID: meta-llama/Meta-Llama-3-8B-Instruct
vllm:
  # Default is vllm
  enabled: true
  LLM_MODEL_ID: meta-llama/Meta-Llama-3-8B-Instruct
  port: 8000 # container port
  shmSize: 128Gi
  VLLM_TORCH_PROFILER_DIR: "/tmp/vllm_profile"
  resources:
    limits:
      cpu: 6
      memory: 8Gi
tei:
  enabled: true
  port: 2081 # container and service port must be > 1024
teirerank:
  enabled: true
  port: 2082 # container and service port must be > 1024

data-prep:
  # the following are for redis-vector-db
  DATAPREP_BACKEND: "REDIS"
  INDEX_NAME: "rag-redis"
  # the following are for qdrant db
  COLLECTION_NAME: "rag-qdrant"
  QDRANT_PORT: 6333
  # the following are for milvus db
  MILVUS_PORT: 19530

retriever-usvc:
  # the following are for redis-vector-db
  RETRIEVER_BACKEND: "REDIS"
  INDEX_NAME: "rag-redis"
  # the following are for qdrant db
  QDRANT_INDEX_NAME: "rag-qdrant"
  QDRANT_PORT: 6333
  # the following are for milvus db
  MILVUS_PORT: 19530

redis-vector-db:
  # redis by default.
  enabled: true
  port: 6379
qdrant:
  # qdrant, disabled by default
  enabled: false
  port: 6333
  tag: "v1.13.1"
  config:
    cluster:
      enabled: false
milvus:
  enabled: false
  port: 19530
  # Milvus config for standalone mode with no PVC which has minimum requirements for the K8s cluster.
  # Check https://github.com/zilliztech/milvus-helm/tree/milvus-4.2.12/charts/milvus for more production level configuration.
  cluster:
    enabled: false
  etcd:
    replicaCount: 1
    persistence:
      enabled: false
  pulsar:
    enabled: false
  minio:
    mode: standalone
    persistence:
      enabled: false
  standalone:
    persistence:
      enabled: false
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 5
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 10

# Microservice layer, disabled by default
llm-uservice:
  enabled: false
  TEXTGEN_BACKEND: "vLLM"
  LLM_MODEL_ID: meta-llama/Meta-Llama-3-8B-Instruct
embedding-usvc:
  enabled: false
  EMBEDDING_BACKEND: "TEI"
reranking-usvc:
  enabled: false
  RERANK_BACKEND: "TEI"

nginx:
  port: 8080 # container port
  service:
    type: NodePort
    # port: 8080 # service port

chatqna-ui:
  image:
    # modified image for redhat security
    repository: edlee123/chatqna-ui
    tag: "latest"
  containerPort: 5173

# disable guardrails by default
# See guardrails-values.yaml for guardrail related options
guardrails-usvc:
  enabled: false
tgi-guardrails:
  enabled: false

dashboard:
  prefix: "OPEA ChatQnA"

global:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  HUGGINGFACEHUB_API_TOKEN: ""
  imagePullSecrets:
    - name: regcred

  # service account name to be shared with all parent/child charts.
  # If set, it will overwrite serviceAccount.name.
  # If set, and serviceAccount.create is false, it will assume this service account is already created by others.
  sharedSAName: "ed-chatqna"
  # set modelUseHostPath or modelUsePVC to use model cache.
  # modelUseHostPath: "/mnt/opea-models"
  modelUsePVC: model-volume

  # Prometheus monitoring + Grafana dashboard(s) for service components?
  monitoring: false

  # Prometheus/Grafana namespace for Dashboard installation
  prometheusNamespace: monitoring

  # Prometheus Helm install release name needed for serviceMonitors
  prometheusRelease: prometheus-stack
